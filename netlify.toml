# netlify.toml for Next.js static export
[build]
  command = "npm run build"
  publish = "out"

# Issue detail URLs are not static files. Rewrite only those single-segment
# routes to the homepage shell so the client router can render them.
# Unmatched paths 404. A /* catch-all would return 200 and the homepage
# for missing URLs, including scanner probes.
[[redirects]]
  from = "/projects/:issue_number"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/products/:issue_number"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/services/:issue_number"
  to = "/index.html"
  status = 200

# Next.js fingerprints everything under /_next/static (content hash, or a
# per-build directory for the manifests), so a year-long immutable cache is safe.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
